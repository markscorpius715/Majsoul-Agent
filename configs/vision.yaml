schema_version: 1
tile_face:
  saturation_max: 105
  value_min: 130
  minimum_fill_ratio: 0.18
  upright_minimum_aspect_ratio: 0.85
hand:
  width_fraction: [0.045, 0.09]
  height_fraction: [0.55, 0.95]
  max_tiles: 14
  drawn_gap_ratio: 1.2
river:
  width_fraction: [0.10, 0.22]
  height_fraction: [0.15, 0.29]
  max_tiles: 24
  row_tolerance_ratio: 0.6
  maximum_row_gap_ratio: 1.5
  horizontal_aspect_ratio: 1.15
slot_rotation_degrees:
  bottom: 0
  top: 180
  left: -90
  right: 90
dora:
  width_fraction: [0.12, 0.25]
  height_fraction: [0.55, 0.98]
  max_tiles: 5
kita:
  bottom:
    width_fraction: [0.15, 0.35]
    height_fraction: [0.40, 0.90]
    max_tiles: 4
  top:
    width_fraction: [0.12, 0.32]
    height_fraction: [0.20, 0.60]
    max_tiles: 4
  left:
    width_fraction: [0.10, 0.35]
    height_fraction: [0.20, 0.75]
    max_tiles: 4
  right:
    width_fraction: [0.10, 0.35]
    height_fraction: [0.20, 0.75]
    max_tiles: 4
meld:
  group_gap_ratio: 1.2
  bottom:
    width_fraction: [0.04, 0.075]
    height_fraction: [0.22, 0.46]
    max_tiles: 16
  top:
    width_fraction: [0.04, 0.08]
    height_fraction: [0.35, 0.70]
    max_tiles: 16
  left:
    width_fraction: [0.05, 0.15]
    height_fraction: [0.20, 0.40]
    max_tiles: 16
  right:
    width_fraction: [0.05, 0.15]
    height_fraction: [0.20, 0.40]
    max_tiles: 16
classifier:
  normalized_size: [64, 96]
  maximum_distance: 0.30
  minimum_margin: 0.04
metadata:
  normalized_size: [32, 48]
  maximum_distance: 0.24
  minimum_margin: 0.035
  dealer_red:
    # A wrapped hue interval: 170..179 plus 0..10.
    lower: [170, 70, 70]
    upper: [10, 255, 255]
  dealer_minimum_fill_ratio: 0.20
  # Maximum HSV value used to isolate the dark wind glyph inside a red dealer tile.
  dealer_glyph_value_max: 110
  styles:
    score:
      lower: [5, 70, 120]
      upper: [35, 255, 255]
      minimum_height_fraction: 0.40
      minimum_area: 20
    center:
      lower: [70, 50, 80]
      upper: [105, 255, 255]
      minimum_height_fraction: 0.35
      minimum_area: 20
    counter:
      lower: [0, 0, 140]
      upper: [179, 100, 255]
      minimum_height_fraction: 0.35
      minimum_area: 20
    seat:
      lower: [0, 0, 100]
      upper: [179, 100, 255]
      minimum_height_fraction: 0.35
      minimum_area: 50
