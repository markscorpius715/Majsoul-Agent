[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "majsoul-vision-agent"
version = "0.1.0"
description = "Visual sanma agent with validated action selection"
requires-python = ">=3.11"
dependencies = ["mahjong>=2.0,<3", "httpx>=0.27,<1", "Pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
vision = ["opencv-python>=4.10,<5", "PyYAML>=6"]
ocr = ["rapidocr==3.10.0", "onnxruntime==1.31.0", "opencv-python-headless==4.13.0.92"]
yolo = ["ultralytics>=8.3"]
test = ["pytest>=8"]
data = ["pyarrow>=17"]

[project.scripts]
majsoul-agent = "majsoul.cli:main"

[tool.setuptools.packages.find]
include = ["majsoul*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
